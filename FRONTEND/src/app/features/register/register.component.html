<div class="register-container">
  <div class="register-box">
    <div class="register-header">
      <h1>QUANTA LTDA</h1>
      <p>Crear Nueva Cuenta</p>
    </div>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          placeholder="Tu nombre"
          [class.error]="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched"
        />
        <small *ngIf="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched" class="error-text">
          El nombre es requerido (mínimo 2 caracteres)
        </small>
      </div>
      
      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input
          type="text"
          id="apellido"
          formControlName="apellido"
          placeholder="Tu apellido"
          [class.error]="registerForm.get('apellido')?.invalid && registerForm.get('apellido')?.touched"
        />
        <small *ngIf="registerForm.get('apellido')?.invalid && registerForm.get('apellido')?.touched" class="error-text">
          El apellido es requerido (mínimo 2 caracteres)
        </small>
      </div>
      
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="correo@example.com"
          [class.error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        />
        <small *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error-text">
          Ingrese un correo válido
        </small>
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Mínimo 8 caracteres"
          [class.error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
        />
        <small *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error-text">
          Contraseña requerida (mínimo 8 caracteres)
        </small>
      </div>
      
      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>
      
      <button type="submit" [disabled]="loading || registerForm.invalid" class="btn-register">
        <span *ngIf="!loading">Registrarse</span>
        <span *ngIf="loading">Cargando...</span>
      </button>
    </form>
    
    <div class="register-footer">
      <p>¿Ya tienes cuenta? <a (click)="goToLogin()" class="link">Inicia sesión</a></p>
    </div>
  </div>
</div>
