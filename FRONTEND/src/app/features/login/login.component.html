<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <h1>QUANTA LTDA</h1>
      <p>Análisis Financiero</p>
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="correo@example.com"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
          Ingrese un correo válido
        </small>
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Ingrese su contraseña"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
          Contraseña requerida (mínimo 6 caracteres)
        </small>
      </div>
      
      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>
      
      <button type="submit" [disabled]="loading || loginForm.invalid" class="btn-login">
        <span *ngIf="!loading">Iniciar Sesión</span>
        <span *ngIf="loading">Cargando...</span>
      </button>
    </form>
    
    <div class="login-footer">
      <p>¿No tienes cuenta? <a (click)="goToRegister()" class="link">Regístrate aquí</a></p>
    </div>
  </div>
</div>
